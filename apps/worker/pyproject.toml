[project]
name = "kgsm"
version = "0.1.0"
description = "Kawalight Game Studio Maker local orchestration worker"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "jsonschema>=4",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
