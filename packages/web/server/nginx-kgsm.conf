# KGSM on a VPS: serve the web bundle statically, proxy /api to the worker.
# Install bundle at /var/www/kgsm (index.html, studio/, games/), worker on
# 127.0.0.1:4317 via kgsm-worker.service. Then the Studio's worker URL is
# simply https://YOUR-DOMAIN (same origin, no CORS issues).
server {
    listen 80;
    server_name YOUR-DOMAIN;
    root /var/www/kgsm;
    index index.html;

    # Static bundle (landing, studio dashboard, playable games).
    location / {
        try_files $uri $uri/ =404;
    }

    # Worker API (routes are /api/v1/*; proxy keeps the URI as-is).
    location /api/ {
        proxy_pass http://127.0.0.1:4317;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }
}
